title: Rotación voluntaria de personal
author: Daniel Carbonó y Luis Pérez
copyright: "2026"
execute:
  execute_notebooks: 'off'     # los .ipynb se ejecutan con compilar.py y se publican con sus salidas
only_build_toc_files: true
exclude_patterns: [fuentes/*, _build/*]
sphinx:
  config:
    html_show_copyright: false
    html_static_path: ['_static']
    html_css_files: ['identidad.css']
    html_context:
      default_mode: light      # la paleta es para fondo claro
